[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-gv-concrete-autoresearch"
version = "0.1.0"
description = "Proof-oriented autonomous research for explicit binary codes"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.scripts]
binary-gv-research = "binary_gv_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
